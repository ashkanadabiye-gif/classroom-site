<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}کلاس مجازی{% endblock %}</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#6b7280;--brand:#2563eb;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c26;--text:#e8eaf0;--muted:#9aa3b2;--line:#2a3040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;line-height:1.7}
nav{display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
nav .brand{font-weight:700;color:var(--brand);text-decoration:none;margin-inline-end:auto}
a{color:var(--brand)}
.container{max-width:900px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;text-decoration:none;font:inherit}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#dc2626}
input,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
form p{margin:0 0 12px}
.muted{color:var(--muted);font-size:.9em}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>
{% block nav %}<nav>
  <a class="brand" href="{% url 'home' %}">🎓 کلاس مجازی</a>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}">داشبورد</a>
    <a href="{% url 'students' %}">دانش‌آموزان</a>
    <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn sec">خروج ({{ user.username }})</button></form>
  {% else %}
    <a href="{% url 'login' %}">ورود</a>
    <a class="btn" href="{% url 'register' %}">ثبت‌نام</a>
  {% endif %}
</nav>{% endblock %}
{% block main %}<main class="container">{% block content %}{% endblock %}</main>{% endblock %}
</body>
</html>
